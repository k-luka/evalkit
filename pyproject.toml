[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.3.0"
description = "Small, boring model evals: run a model on a benchmark, get a results table."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
wandb = ["wandb>=0.17"]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools]
packages = ["evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
